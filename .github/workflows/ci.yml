name: Core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Select the installed Python without a managed download
        shell: bash
        run: python -c "import os,sys; open(os.environ['GITHUB_ENV'], 'a').write('UV_PYTHON=' + sys.executable + '\n')"
      - name: Install locked core and development dependencies
        run: uv sync --locked --extra dev --extra lint
      - name: Exercise guided setup on macOS and Linux
        if: matrix.python == '3.12' && runner.os != 'Windows'
        shell: bash
        run: bash scripts/setup.sh
      - name: Validate project configuration
        run: uv run --no-sync python scripts/validate_project.py
      - name: Lint
        run: uv run --no-sync python -m ruff check src scripts tests
      - name: Test isolated synthetic workflows
        run: uv run --no-sync python -m pytest -q
      - name: Check CLI entry point
        run: uv run --no-sync python -m slr_workbench --help
      - name: Build source and wheel distributions
        run: uv build
      - name: Verify packaged migrations
        run: uv run --no-sync python scripts/validate_distribution.py

  windows-official-python:
    name: Windows / python.org 3.12 installer
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install signed Python.org distribution
        shell: pwsh
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP "python-3.12.10.exe"
          $PythonDir = Join-Path $env:RUNNER_TEMP "python-org-312"
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe" -OutFile $Installer
          if ((Get-AuthenticodeSignature $Installer).Status -ne "Valid") {
            throw "Python installer signature verification failed"
          }
          $Arguments = "/quiet InstallAllUsers=0 Include_launcher=0 Include_test=0 PrependPath=0 TargetDir=`"$PythonDir`""
          $Install = Start-Process $Installer -ArgumentList $Arguments -Wait -PassThru
          if ($Install.ExitCode -notin @(0, 3010)) { throw "Python install failed: $($Install.ExitCode)" }
          "UV_PYTHON=$PythonDir\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Exercise guided setup with the official Python
        shell: pwsh
        run: |
          ./scripts/setup.ps1 -PythonPath $env:UV_PYTHON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/setup.ps1 -PythonPath $env:UV_PYTHON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -m slr_workbench --help
      - run: uv run --no-sync python scripts/validate_project.py
      - run: uv run --no-sync python -m pytest -q
