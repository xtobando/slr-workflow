services:
  workbench:
    build:
      context: .
      args:
        SLR_EXTRAS: ${SLR_EXTRAS:-}
    init: true
    stdin_open: true
    tty: true
    user: "${SLR_UID:-1000}:${SLR_GID:-1000}"
    volumes:
      - .:/review
      - backups:/backups
      - opencode-state:/state

volumes:
  backups:
  opencode-state:
