[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slr-opencode-workbench"
version = "0.1.0"
description = "An editable, evidence-grounded SLR workflow for VS Code and OpenCode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "rich>=13,<15"]

[project.optional-dependencies]
documents = ["docling>=2,<4"]
rag = ["chromadb>=1,<2", "sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10"]
lint = ["ruff>=0.6,<1"]

[project.scripts]
slr = "slr_workbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slr_workbench = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
required-version = "==0.12.23"
python-downloads = "never"
python-preference = "only-system"
