[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slr-opencode-workbench"
version = "0.1.0"
description = "An editable, evidence-grounded SLR workflow for VS Code and OpenCode"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "typer>=0.12,<1", "rich>=13,<15"]

[project.optional-dependencies]
documents = ["docling>=2,<4"]
rag = ["chromadb>=1,<2", "sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
slr = "slr_workbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slr_workbench = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

